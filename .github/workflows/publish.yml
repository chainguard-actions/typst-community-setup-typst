name: Publish
on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
concurrency: ${{ github.workflow }}
jobs:
  publish-action:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: rm -rf node_modules
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add -Af && git commit -m 'npm run build'
      - run: git tag -f "$TAG" && git push -f origin "$TAG"
        if: ${{ github.event_name == 'release' }}
        env:
          TAG: ${{ github.event.release.tag_name }}
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        if: ${{ github.event_name == 'release' && github.event.release.prerelease != 'true' }}
        with:
          script: |
            const tagName = context.payload.release.tag_name;
            const [major, minor, patch] = tagName.split('.');
            async function tag(tag) {
              await exec.exec('git', ['tag', '-f', tag]);
              await exec.exec('git', ['push', '-f', 'origin', tag]);
            }
            await tag(`${major}.${minor}`);
            await tag(`${major}`);
      - run: git checkout -b "$REF_NAME"-preview && git push -f origin "$REF_NAME"-preview
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REF_NAME: ${{ github.ref_name }}
