name: Publish
on:
  release:
    types: released
  workflow_dispatch:
concurrency: ${{ github.workflow }}
jobs:
  publish-action:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: rm -rf node_modules
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add -Af && git commit -m 'npm run build'
      - run: git tag -f "$TAG" && git push -f origin "$TAG"
        if: ${{ github.event_name == 'release' }}
        env:
          TAG: ${{ github.event.release.tag_name }}
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        with:
          script: |
            const tagName = context.payload.release.tag_name;
            const [major, minor, patch] = tagName.split('.');
            async function tag(tag) {
              await exec.exec('git', ['tag', '-f', tag]);
              await exec.exec('git', ['push', '-f', 'origin', tag]);
            }
            await tag(`${major}.${minor}`);
            await tag(`${major}`);
      - run: git checkout -b "$REF_NAME"-preview && git push -f origin "$REF_NAME"-preview
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REF_NAME: ${{ github.ref_name }}
