name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
concurrency: ${{ github.workflow }}
jobs:
  publish-action:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: rm -rf node_modules
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add -Af && git commit -m 'npm run build'
      - run: git tag -f "$TAG" && git push -f origin "$TAG"
        if: ${{ github.event_name == 'release' }}
        env:
          TAG: ${{ github.event.release.tag_name }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        with:
          script: |
            const tagName = context.payload.release.tag_name;
            const [major, minor, patch] = tagName.split('.');
            async function tag(tag) {
              await exec.exec('git', ['tag', '-f', tag]);
              await exec.exec('git', ['push', '-f', 'origin', tag]);
            }
            await tag(`${major}.${minor}`);
            await tag(`${major}`);
      - run: git checkout -b "$REF_NAME"-preview && git push -f origin "$REF_NAME"-preview
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REF_NAME: ${{ github.ref_name }}
