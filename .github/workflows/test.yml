name: Test
on:
  push:
    branches: [ main ]
    paths-ignore:
      - .gitattributes
      - .gitignore
      - action.yml
      - LICENSE
      - '**.md'
      - LICENSE
      - .github/**
      - '!.github/workflows/test.yml'
  pull_request:
    paths-ignore:
      - .gitattributes
      - .gitignore
      - action.yml
      - LICENSE
      - '**.md'
      - .github/**
      - '!.github/workflows/test.yml'
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: action-dist
          path: ./dist
  test-basic:
    runs-on: ${{ matrix.os }}
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: action-dist
          path: ./dist
      - uses: ./
        with:
          cache-dependency-path: test/basic/requirements.typ
      - run: typst --version
      - run: typst compile test/basic/main.typ
  test-zip-packages:
    runs-on: ${{ matrix.os }}
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: action-dist
          path: ./dist
      - uses: ./
        with:
          typst-version: v0.13
          zip-packages: test/zip-packages/requirements.json
          cache-local-packages: true
      - run: typst --version
      - run: typst compile test/zip-packages/main.typ
