name: Test Typst version range
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          typst-version: ">=0.13.0 <0.14.0"
      - name: Assert typst is on PATH
        run: |
          if ! which typst; then
            echo "FAIL: typst not found on PATH"
            exit 1
          fi
          echo "PASS: typst found on PATH"
      - name: Assert typst version is in range 0.13.x
        run: |
          VERSION=$(typst --version)
          echo "actual version output: $VERSION"
          if echo "$VERSION" | grep -qE "0\.13\.[0-9]+"; then
            echo "PASS: typst version is in range 0.13.x"
          else
            echo "FAIL: expected version in range 0.13.x but got: $VERSION"
            exit 1
          fi
