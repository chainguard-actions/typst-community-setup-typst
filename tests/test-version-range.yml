name: Test version range syntax
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          typst-version: ">=0.10.0 <0.12.0"
          token: ${{ github.token }}
      - name: Assert typst is on PATH
        run: |
          echo "Checking typst is available..."
          if ! command -v typst >/dev/null 2>&1; then
            echo "FAIL: typst not found on PATH"
            exit 1
          fi
          echo "PASS: typst found at $(command -v typst)"
      - name: Assert typst version is within range
        run: |
          VERSION_OUTPUT=$(typst --version)
          echo "typst version output: $VERSION_OUTPUT"
          # Extract the version number (e.g. "typst 0.11.0 (...)")
          VERSION=$(echo "$VERSION_OUTPUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Parsed version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: could not parse version from: $VERSION_OUTPUT"
            exit 1
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          # Check version is >= 0.10.0 and < 0.12.0
          if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -ge 10 ] && [ "$MINOR" -lt 12 ]; then
            echo "PASS: version $VERSION is within range >=0.10.0 <0.12.0"
          else
            echo "FAIL: version $VERSION is NOT within range >=0.10.0 <0.12.0"
            exit 1
          fi
