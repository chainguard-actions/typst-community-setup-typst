name: Test version range syntax
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install xz-utils for tar extraction
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq xz-utils
          fi
          echo "xz available: $(xz --version | head -1)"
      - id: action
        uses: .
        with:
          typst-version: ">=0.11.0 <0.12.0"
          token: ${{ github.token }}
      - name: Assert typst is on PATH
        run: |
          echo "Checking typst is available..."
          if ! which typst; then
            echo "FAIL: typst not found on PATH"
            exit 1
          fi
          echo "PASS: typst found at $(which typst)"
      - name: Assert typst version is within range
        run: |
          VERSION_OUTPUT=$(typst --version)
          echo "typst version output: $VERSION_OUTPUT"
          # Extract version number from output like "typst 0.11.0 (hash)"
          VERSION=$(echo "$VERSION_OUTPUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Extracted version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: could not extract version number from: $VERSION_OUTPUT"
            exit 1
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          if [ "$MAJOR" -ne 0 ] || [ "$MINOR" -ne 11 ]; then
            echo "FAIL: expected version in range >=0.11.0 <0.12.0 but got: $VERSION"
            exit 1
          fi
          echo "PASS: typst version $VERSION is within range >=0.11.0 <0.12.0"
