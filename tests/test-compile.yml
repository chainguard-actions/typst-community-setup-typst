name: Test compiling a document
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-version: "^0.13"
      - name: Compile a document and assert PDF produced
        run: |
          typst --version
          printf '= Hello\n\nThis is a test.\n' > /tmp/hello.typ
          typst compile /tmp/hello.typ /tmp/hello.pdf
          if [ ! -s /tmp/hello.pdf ]; then
            echo "FAIL: PDF not produced"
            exit 1
          fi
          head -c 5 /tmp/hello.pdf | grep -q '%PDF-' || { echo "FAIL: not a PDF"; exit 1; }
          echo "PASS"
