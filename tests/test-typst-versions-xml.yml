name: Test typst-versions-xml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-versions-xml: |
            <?xml version="1.0" encoding="UTF-8"?>
            <root>
              <typst>
                <version>latest</version>
              </typst>
            </root>
      - name: Assert typst is installed via xml config
        run: |
          which typst
          typst --version
          echo "PASS: typst installed via typst-versions-xml"
