name: Test zip-packages-json installs local and preview packages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-version: 0.12.0
          zip-packages-json: |
            {
              "preview": {
                "algorithmic": "https://github.com/typst-community/typst-algorithmic/archive/refs/tags/v1.0.0.zip"
              },
              "local": {
                "algorithmic": {
                  "9.9.9": "https://github.com/typst-community/typst-algorithmic/archive/refs/tags/v1.0.0.zip"
                }
              }
            }
      - name: Assert packages extracted
        run: |
          BASE="${XDG_CACHE_HOME:-$HOME/.cache}/typst/packages"
          ls -R "$BASE" | head -50 || true
          if ! ls "$BASE"/preview/algorithmic/*/typst.toml >/dev/null 2>&1; then
            echo "FAIL: preview algorithmic package not found"
            exit 1
          fi
          if [ ! -f "$BASE/local/algorithmic/9.9.9/typst.toml" ]; then
            echo "FAIL: local algorithmic 9.9.9 (version override) not found"
            exit 1
          fi
          if ! grep -q '9.9.9' "$BASE/local/algorithmic/9.9.9/typst.toml"; then
            echo "FAIL: version override not written to typst.toml"
            exit 1
          fi
          echo "PASS"
