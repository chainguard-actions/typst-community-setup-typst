name: Test multiple versions via typst-versions-hjson
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-versions-hjson: |
            {
              # HJSON allows comments and unquoted values
              typst-hjson-a: {
                version: "0.11.1"
              }
              typst-hjson-b: {
                version: "0.12.0"
              }
            }
      - name: Assert executables installed with correct versions
        run: |
          A="$(typst-hjson-a --version)"
          B="$(typst-hjson-b --version)"
          echo "a: $A"
          echo "b: $B"
          if ! echo "$A" | grep -qE '^typst 0\.11\.1( |$)'; then
            echo "FAIL: typst-hjson-a should be 0.11.1"
            exit 1
          fi
          if ! echo "$B" | grep -qE '^typst 0\.12\.0( |$)'; then
            echo "FAIL: typst-hjson-b should be 0.12.0"
            exit 1
          fi
          echo "PASS"
