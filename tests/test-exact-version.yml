name: Test exact version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-version: "0.12.0"
      - name: Assert installed version is 0.12.0
        run: |
          OUT="$(typst --version)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -qE '^typst 0\.12\.0( |$)'; then
            echo "FAIL: expected typst 0.12.0"
            exit 1
          fi
          echo "PASS"
