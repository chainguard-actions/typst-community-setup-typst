name: Test multiple versions via YAML file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install xz-utils for tar extraction
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq xz-utils
          fi
          echo "xz available: $(xz --version | head -1)"
      - id: action
        uses: .
        with:
          typst-versions-file: "${{ github.workspace }}/tests/fixtures/typst-versions.yaml"
          token: ${{ github.token }}
      - name: Assert typst-stable is on PATH
        run: |
          echo "Checking typst-stable is available..."
          if ! which typst-stable; then
            echo "FAIL: typst-stable not found on PATH"
            exit 1
          fi
          echo "PASS: typst-stable found at $(which typst-stable)"
      - name: Assert typst-stable version is correct
        run: |
          VERSION_OUTPUT=$(typst-stable --version)
          echo "typst-stable version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "0.11.0"; then
            echo "FAIL: expected version 0.11.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: typst-stable version 0.11.0 confirmed"
