name: Test typst-versions-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-versions-file: ${{ github.workspace }}/actions/hardened/typst-community--setup-typst/v5.1.0/tests/fixtures/typst-versions.yaml
      - name: Assert typst is installed via versions file
        run: |
          which typst
          typst --version
          echo "PASS: typst installed via typst-versions-file"
