name: Test multiple versions via typst-versions-yaml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-versions-yaml: |
            typst-a:
              version: "0.13.1"
            typst-b:
              version: "~0.10.0"
      - name: Assert both executables installed with correct versions
        run: |
          A="$(typst-a --version)"
          B="$(typst-b --version)"
          echo "a: $A"
          echo "b: $B"
          if ! echo "$A" | grep -qE '^typst 0\.13\.1( |$)'; then
            echo "FAIL: typst-a should be 0.13.1"
            exit 1
          fi
          if ! echo "$B" | grep -qE '^typst 0\.10\.[0-9]+'; then
            echo "FAIL: typst-b should be 0.10.x"
            exit 1
          fi
          echo "PASS"
