name: Test zip-packages-ini
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          zip-packages-ini: |
            [local]
            algorithmic = https://github.com/typst-community/typst-algorithmic/archive/refs/tags/v1.0.0.zip
      - name: Assert local package installed
        run: |
          PKG_ROOT="${XDG_CACHE_HOME:-$HOME/.cache}/typst/packages"
          ls -R "$PKG_ROOT/local" 2>/dev/null | head -30 || true
          FOUND="$(find "$PKG_ROOT/local/algorithmic" -mindepth 2 -maxdepth 2 -name typst.toml 2>/dev/null | head -1)"
          echo "found: $FOUND"
          if [ -z "$FOUND" ]; then
            echo "FAIL: @local/algorithmic not installed"
            exit 1
          fi
          echo "PASS"
