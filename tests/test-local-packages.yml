name: Test local-packages input (deprecated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          typst-version: latest
          local-packages: ${{ github.workspace }}/actions/hardened/typst-community--setup-typst/v4.2.0/tests/fixtures/packages.json
      - name: Assert typst-version output is set
        env:
          TYPST_VERSION: ${{ steps.setup.outputs.typst-version }}
        run: |
          echo "typst-version: $TYPST_VERSION"
          if [ -z "$TYPST_VERSION" ]; then
            echo "FAIL: typst-version output is empty"
            exit 1
          fi
          echo "PASS: typst-version=$TYPST_VERSION"
      - name: Assert typst binary is available
        run: |
          if ! command -v typst &>/dev/null; then
            echo "FAIL: typst binary not found in PATH"
            exit 1
          fi
          echo "PASS: typst found at $(command -v typst)"
