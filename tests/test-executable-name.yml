name: Test custom executable name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-version: "0.12.0"
          executable-name: typst-custom
      - name: Assert custom executable works
        run: |
          if ! command -v typst-custom >/dev/null 2>&1; then
            echo "FAIL: typst-custom not found on PATH"
            exit 1
          fi
          OUT="$(typst-custom --version)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q '0\.12\.0'; then
            echo "FAIL: expected version 0.12.0"
            exit 1
          fi
          echo "PASS"
