name: Test basic usage - install latest typst
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-typst
        uses: .
        with:
          typst-version: latest
      - name: Assert typst is installed
        run: |
          echo "Checking typst is in PATH..."
          if ! command -v typst &>/dev/null; then
            echo "FAIL: typst not found in PATH"
            exit 1
          fi
          echo "PASS: typst found at $(which typst)"
      - name: Assert typst version output
        run: |
          VERSION=$(typst --version 2>&1 || true)
          echo "typst version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: typst --version returned empty output"
            exit 1
          fi
          echo "PASS"
