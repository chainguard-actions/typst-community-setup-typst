name: Test basic usage - install latest Typst
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-version: latest
          token: ${{ github.token }}
      - name: Assert typst is on PATH
        run: |
          echo "Checking typst is available..."
          if ! command -v typst >/dev/null 2>&1; then
            echo "FAIL: typst not found on PATH"
            exit 1
          fi
          echo "PASS: typst found at $(command -v typst)"
      - name: Assert typst runs and reports version
        run: |
          VERSION=$(typst --version 2>&1)
          echo "typst version output: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: typst --version returned empty output"
            exit 1
          fi
          echo "PASS: typst version: $VERSION"
