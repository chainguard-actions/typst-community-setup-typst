name: Test basic usage - latest Typst
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          typst-version: latest
          token: ${{ github.token }}
      - name: Assert typst-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.typst-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: typst-version output is empty"
            exit 1
          fi
          echo "PASS: typst-version=$ACTUAL"
      - name: Assert typst is on PATH
        run: |
          if ! command -v typst >/dev/null 2>&1; then
            echo "FAIL: typst not found on PATH"
            exit 1
          fi
          echo "PASS: typst found at $(command -v typst)"
      - name: Assert typst runs
        run: |
          VERSION=$(typst --version)
          echo "typst version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: typst --version returned empty"
            exit 1
          fi
          echo "PASS"
