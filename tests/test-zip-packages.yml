name: Test zip-packages input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-typst
        uses: .
        with:
          typst-version: latest
          zip-packages: >-
            ${{ github.workspace }}/actions/hardened/typst-community--setup-typst/v5.0.0/tests/fixtures/packages.json
      - name: Assert typst is installed
        run: |
          echo "Checking typst is in PATH..."
          if ! command -v typst &>/dev/null; then
            echo "FAIL: typst not found in PATH"
            exit 1
          fi
          echo "PASS: typst found at $(which typst)"
          typst --version
