name: Test zip-packages input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create zip-packages JSON descriptor
        run: |
          # The zip-packages JSON must have 'local' and 'preview' keys as objects.
          # Using empty objects so no actual package downloads are attempted.
          cat > /tmp/packages.json << 'EOF'
          {
            "local": {},
            "preview": {}
          }
          EOF
          echo "Created packages.json:"
          cat /tmp/packages.json
      - id: setup
        uses: .
        with:
          typst-version: "0.12.0"
          token: ${{ github.token }}
          zip-packages: /tmp/packages.json
      - name: Assert typst-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.typst-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: typst-version output is empty"
            exit 1
          fi
          echo "PASS: typst-version=$ACTUAL"
      - name: Assert typst is on PATH
        run: |
          if ! command -v typst >/dev/null 2>&1; then
            echo "FAIL: typst not found on PATH"
            exit 1
          fi
          echo "PASS: typst found at $(command -v typst)"
      - name: Assert typst runs correctly
        run: |
          VERSION_OUTPUT=$(typst --version)
          echo "typst --version: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: typst --version returned empty"
            exit 1
          fi
          echo "PASS"
