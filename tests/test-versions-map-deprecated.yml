name: Test deprecated typst-versions-map
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-versions-map: |
            {
              "typst-map-latest": {"version": "latest"},
              "typst-map-013": {"version": "v0.13"}
            }
      - name: Assert executables installed
        run: |
          A="$(typst-map-latest --version)"
          B="$(typst-map-013 --version)"
          echo "typst-map-latest: $A"
          echo "typst-map-013: $B"
          echo "$A" | grep -qiE 'typst [0-9]+\.[0-9]+' || { echo "FAIL: typst-map-latest bad output"; exit 1; }
          echo "$B" | grep -q '0\.13\.' || { echo "FAIL: typst-map-013 expected 0.13.x"; exit 1; }
          echo "PASS"
