name: Test multiple versions via typst-versions-json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-versions-json: |
            {
              "typst-old": { "version": "0.11.1" },
              "typst-new": { "version": "0.12.0" }
            }
      - name: Assert both executables installed with correct versions
        run: |
          OLD="$(typst-old --version)"
          NEW="$(typst-new --version)"
          echo "old: $OLD"
          echo "new: $NEW"
          if ! echo "$OLD" | grep -qE '^typst 0\.11\.1( |$)'; then
            echo "FAIL: typst-old should be 0.11.1"
            exit 1
          fi
          if ! echo "$NEW" | grep -qE '^typst 0\.12\.0( |$)'; then
            echo "FAIL: typst-new should be 0.12.0"
            exit 1
          fi
          echo "PASS"
