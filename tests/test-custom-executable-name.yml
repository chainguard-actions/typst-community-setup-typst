name: Test custom executable name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install xz-utils for tar extraction
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq xz-utils
          fi
          echo "xz available: $(xz --version | head -1)"
      - id: action
        uses: .
        with:
          typst-version: "0.11.0"
          executable-name: typst-custom
          token: ${{ github.token }}
      - name: Assert custom executable is on PATH
        run: |
          echo "Checking typst-custom is available..."
          if ! which typst-custom; then
            echo "FAIL: typst-custom not found on PATH"
            exit 1
          fi
          echo "PASS: typst-custom found at $(which typst-custom)"
      - name: Assert custom executable runs
        run: |
          VERSION_OUTPUT=$(typst-custom --version)
          echo "typst-custom version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: typst-custom --version returned empty output"
            exit 1
          fi
          echo "PASS: typst-custom --version returned: $VERSION_OUTPUT"
      - name: Assert default name is NOT on PATH
        run: |
          if which typst 2>/dev/null; then
            echo "INFO: 'typst' is also on PATH (may be acceptable if action adds both)"
          else
            echo "PASS: 'typst' not on PATH, only custom name is installed"
          fi
