name: Test custom executable name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-version: latest
          executable-name: typst-custom
          token: ${{ github.token }}
      - name: Assert custom executable is on PATH
        run: |
          echo "Checking typst-custom is available..."
          if ! which typst-custom; then
            echo "FAIL: typst-custom not found on PATH"
            exit 1
          fi
          echo "PASS: typst-custom found on PATH"
      - name: Assert custom executable runs and reports version
        run: |
          VERSION=$(typst-custom --version)
          echo "typst-custom version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: typst-custom --version returned empty output"
            exit 1
          fi
          echo "PASS: typst-custom version is '$VERSION'"
      - name: Assert default 'typst' name is NOT on PATH
        run: |
          if which typst 2>/dev/null; then
            echo "INFO: 'typst' is also on PATH (may be acceptable if only custom name was requested)"
          else
            echo "PASS: only custom executable name is installed"
          fi
