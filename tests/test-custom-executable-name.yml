name: Test custom executable name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-typst
        uses: .
        with:
          typst-version: latest
          executable-name: typst-custom
          token: ${{ github.token }}
      - name: Assert custom executable is on PATH
        run: |
          if ! command -v typst-custom >/dev/null 2>&1; then
            echo "FAIL: typst-custom not found on PATH"
            exit 1
          fi
          echo "PASS: typst-custom found at $(command -v typst-custom)"
      - name: Assert custom executable runs correctly
        run: |
          VERSION=$(typst-custom --version 2>&1)
          echo "typst-custom version output: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: typst-custom --version returned empty output"
            exit 1
          fi
          echo "PASS: typst-custom version is $VERSION"
      - name: Assert default 'typst' name is NOT on PATH (only custom name was installed)
        run: |
          if command -v typst >/dev/null 2>&1; then
            echo "INFO: 'typst' is also on PATH (may be expected if action installs both)"
          else
            echo "PASS: only custom executable name was installed"
          fi
