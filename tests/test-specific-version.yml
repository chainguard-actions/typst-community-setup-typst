name: Test specific Typst version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          typst-version: "0.12.0"
          token: ${{ github.token }}
      - name: Assert typst-version output matches requested version
        env:
          ACTUAL: ${{ steps.setup.outputs.typst-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "0.12.0" ]; then
            echo "FAIL: expected '0.12.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: typst-version=$ACTUAL"
      - name: Assert typst is on PATH and correct version
        run: |
          if ! command -v typst >/dev/null 2>&1; then
            echo "FAIL: typst not found on PATH"
            exit 1
          fi
          VERSION_OUTPUT=$(typst --version)
          echo "typst --version: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "0.12.0"; then
            echo "FAIL: expected version 0.12.0 in output: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS"
