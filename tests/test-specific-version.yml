name: Test specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-version: "0.11.0"
      - name: Assert installed version is 0.11.0
        run: |
          OUT="$(typst --version)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q '0\.11\.0'; then
            echo "FAIL: expected version 0.11.0"
            exit 1
          fi
          echo "PASS"
