name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-typst
        uses: .
        with:
          typst-version: "0.11.0"
          token: ${{ github.token }}
      - name: Assert typst is on PATH
        run: |
          if ! command -v typst >/dev/null 2>&1; then
            echo "FAIL: typst not found on PATH"
            exit 1
          fi
          echo "PASS: typst found at $(command -v typst)"
      - name: Assert typst version matches requested version
        run: |
          VERSION_OUTPUT=$(typst --version 2>&1)
          echo "typst version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "0.11.0"; then
            echo "PASS: typst version 0.11.0 is installed"
          else
            echo "FAIL: expected version 0.11.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
