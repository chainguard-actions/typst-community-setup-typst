name: Test multiple Typst versions via versions map
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          typst-versions-map: |
            {
              "typst-stable": { "version": "0.13.0" },
              "typst-older": { "version": "0.12.0" }
            }
      - name: Assert typst-stable is on PATH
        run: |
          if ! which typst-stable; then
            echo "FAIL: typst-stable not found on PATH"
            exit 1
          fi
          echo "PASS: typst-stable found on PATH"
      - name: Assert typst-stable version
        run: |
          VERSION=$(typst-stable --version)
          echo "actual version output: $VERSION"
          if echo "$VERSION" | grep -q "0.13.0"; then
            echo "PASS: typst-stable version is 0.13.0"
          else
            echo "FAIL: expected 0.13.0 but got: $VERSION"
            exit 1
          fi
      - name: Assert typst-older is on PATH
        run: |
          if ! which typst-older; then
            echo "FAIL: typst-older not found on PATH"
            exit 1
          fi
          echo "PASS: typst-older found on PATH"
      - name: Assert typst-older version
        run: |
          VERSION=$(typst-older --version)
          echo "actual version output: $VERSION"
          if echo "$VERSION" | grep -q "0.12.0"; then
            echo "PASS: typst-older version is 0.12.0"
          else
            echo "FAIL: expected 0.12.0 but got: $VERSION"
            exit 1
          fi
