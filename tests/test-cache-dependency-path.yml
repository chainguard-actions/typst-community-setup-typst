name: Test cache-dependency-path downloads preview packages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create requirements file
        run: |
          printf '#import "@preview/example:0.1.0": *\n' > "$RUNNER_TEMP/requirements.typ"
          cat "$RUNNER_TEMP/requirements.typ"
      - id: action
        uses: .
        with:
          typst-version: 0.12.0
          cache-dependency-path: ${{ runner.temp }}/requirements.typ
      - name: Assert preview package is present in typst package cache
        run: |
          PKG="${XDG_CACHE_HOME:-$HOME/.cache}/typst/packages/preview/example/0.1.0"
          echo "checking: $PKG"
          ls -la "$PKG" || true
          if [ ! -f "$PKG/typst.toml" ]; then
            echo "FAIL: @preview/example:0.1.0 not found in package cache"
            exit 1
          fi
          echo "PASS"
