name: Test cache-dependency-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Typst file with import statements
        run: |
          mkdir -p "$GITHUB_WORKSPACE/typst-fixtures"
          cat > "$GITHUB_WORKSPACE/typst-fixtures/main.typ" <<'EOF'
          #import "@preview/cetz:0.1.2": *
          = Hello World
          EOF

      - id: action
        uses: .
        with:
          typst-version: latest
          cache-dependency-path: "${{ github.workspace }}/typst-fixtures/main.typ"

      - name: Assert typst is installed and on PATH
        run: |
          echo "Checking typst is available..."
          if ! command -v typst >/dev/null 2>&1; then
            echo "FAIL: typst not found on PATH"
            exit 1
          fi
          echo "PASS: typst is installed"
          typst --version
