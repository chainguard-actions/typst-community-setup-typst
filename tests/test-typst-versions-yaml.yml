name: Test typst-versions-yaml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          typst-versions-yaml: |
            typst:
              version: latest
      - name: Assert typst is installed via yaml config
        run: |
          which typst
          typst --version
          echo "PASS: typst installed via typst-versions-yaml"
